name: "staging-17069 windows-latest"
on:
  push:
    branches: ["pr-17069-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart psutil
      - run: |
          for attempt in 1 2 3; do python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo" trl peft && break; [ "$attempt" = 3 ] && exit 1; sleep $((5 * attempt)); done
      - run: python -c "import torch, importlib.util as u; assert u.find_spec('unsloth_zoo'); print('torch', torch.__version__); assert '+cu' not in torch.__version__"
      - run: rc=0; ran=0; rm -f pytest_out.txt; r=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_audio_cpp_models.py studio/backend/tests/test_audio_cpp_runtime_specs.py studio/backend/tests/test_audio_cpp_umbrella_catalog.py studio/backend/tests/test_chat_generation_supervisor.py studio/backend/tests/test_decision_native.py studio/backend/tests/test_lfm3_spoken_reply.py studio/backend/tests/test_multi_model_serving.py studio/backend/tests/test_vad_audiocpp_sidecar.py studio/backend/tests/test_voice_decision_switch.py studio/backend/tests/test_voice_decisions.py studio/backend/tests/test_voice_log.py studio/backend/tests/test_voice_log_chat_deletes.py studio/backend/tests/test_voice_models.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$r" -gt "$rc" ]; then rc=$r; fi; fi; if [ "$ran" = "0" ]; then rc=5; fi; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* ((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found. Please install .*)$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found)/ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers).|Unsloth. (torch|unsloth_zoo|transformers) not found" pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/audio-cpp-catalog.test.ts tests/audio-picker-filter.test.ts tests/audio-recommended-mode-order.test.ts tests/composer-icon-alignment.test.ts tests/mic-target.test.ts tests/native-model-folder-picker.test.ts tests/read-aloud-studio-voice.test.ts tests/scan-folder-status.test.ts tests/voice-audiocpp-models.test.ts tests/voice-barge-gate.test.ts tests/voice-blob-decay.test.ts tests/voice-blob-shape.test.ts tests/voice-chat-model-voice.test.ts tests/voice-controls-i18n.test.ts tests/voice-detector-release.test.ts tests/voice-early-interject.test.ts tests/voice-hearing-hint.test.ts tests/voice-hears-audio.test.ts tests/voice-held-edit.test.ts tests/voice-hold-to-stop.test.ts tests/voice-laya-outcomes.test.ts tests/voice-loop-bridge.test.ts tests/voice-mic-health.test.ts tests/voice-orb-approval-decide.test.ts tests/voice-orb-crossfade.test.ts tests/voice-orb-dwell.test.ts tests/voice-orb-overlay-prefs.test.ts tests/voice-orb-stack.test.ts tests/voice-orb-state.test.ts tests/voice-orb-widget-approval.test.ts tests/voice-orb-widget-return.test.ts tests/voice-orb-widget.test.ts tests/voice-pending-notes-reset.test.ts tests/voice-pill-tone.test.ts tests/voice-reply-echo.test.ts tests/voice-reveal-enter.test.ts tests/voice-sentence-chunker.test.ts tests/voice-settings-storage-sync.test.ts tests/voice-slot-ownership.test.ts tests/voice-speakable-text.test.ts tests/voice-spectrum-bands.test.ts tests/voice-spectrum-output-pause.test.ts tests/voice-speech-numbers-json.test.ts tests/voice-split-streaming.test.ts tests/voice-thinking-filler.test.ts tests/voice-tts-chunk-plan.test.ts tests/voice-tts-clip-ledger.test.ts tests/voice-turn-complete.test.ts tests/voice-typed-send.test.ts tests/voice-vad-client-unload.test.ts tests/voice-voiced-thread-remount.test.ts
