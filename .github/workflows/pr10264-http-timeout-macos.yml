# Disposable repro workflow. Delete after validation.

name: "PR 10264 HTTP timeout macOS proof"

on:
  push:
    branches:
      - "fix/pr-10264-http-timeout-macos-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-15"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Verify bounded auth-check request across Hub clients"
        shell: bash
        run: |
          for version in 0.34.0 0.36.2 1.23.0 1.30.0; do
            python -m pip install --quiet --upgrade "huggingface_hub==$version"
            python tests/studio/pr10264_timeout_probe.py studio/backend/hub/utils/hf_tokens.py
          done
