# Disposable live Studio repro workflow. Delete after validation.

name: "PR 9640 live Studio UI A-B"

on:
  push:
    branches:
      - "fix/pr-9640-ab-ui-20260825"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-studio:
    name: "Studio smoke (${{ matrix.os }}, ${{ matrix.browser }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        browser: ["chromium"]
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-${{ matrix.browser }}
      STUDIO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install Playwright dependencies
        shell: bash
        timeout-minutes: 33
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '420'
          APT_ACQUIRE_RETRIES: '0'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          if [ "$RUNNER_OS" = "Linux" ]; then
            bash .github/scripts/retry-with-apt-lock.sh \
              python -m playwright install "${{ matrix.browser }}"
            if ! python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = getattr(playwright, "${{ matrix.browser }}").launch()
              browser.close()
          PY
            then
              bash .github/scripts/retry-with-apt-lock.sh \
                python -m playwright install-deps "${{ matrix.browser }}"
            fi
          else
            python -m playwright install "${{ matrix.browser }}"
          fi

      - name: Install Studio from this branch (Unix)
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          mkdir -p /tmp/pr9640-script-bundle
          cp -R .github/scripts/. /tmp/pr9640-script-bundle/
          git fetch --no-tags https://github.com/unslothai/unsloth.git b9792a5b14bd4bbf292d1a3b5404fb7654b50615 d453a1986e85c18de64ce9b8b2f0ffd46a53fd54
          git checkout --detach d453a1986e85c18de64ce9b8b2f0ffd46a53fd54
          mkdir -p .github/scripts
          cp -R /tmp/pr9640-script-bundle/. .github/scripts/
          bash ./install.sh --local --no-torch

      - name: Launch Studio and run Playwright probe
        shell: bash
        run: |
          python ".github/scripts/pr9640-ui-probe.py"

      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-smoke-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
