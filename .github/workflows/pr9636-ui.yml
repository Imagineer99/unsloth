# Disposable live Studio repro workflow. Delete after validation.

name: "PR 9636 Studio MCP Embedded Resource UI"

on:
  push:
    branches:
      - "fix/pr-9636-mcp-repro-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-studio:
    if: github.ref_name != 'fix/pr-9636-mcp-repro-uri-fixed'
    name: "Studio MCP image (${{ matrix.os }}, ${{ matrix.browser }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-${{ matrix.browser }}
      STUDIO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Playwright dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps "${{ matrix.browser }}"
          else
            python -m playwright install "${{ matrix.browser }}"
          fi

      - name: Install Studio from this branch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:UNSLOTH_STUDIO_HOME | Out-Null
          & ./install.ps1 --local --no-torch

      - name: Install Studio from this branch (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          bash ./install.sh --local --no-torch

      - name: Launch Studio and run Playwright probe
        shell: bash
        run: |
          python ".github/scripts/pr9636-ui-probe.py"

      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-pr9636-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
