name: PR9666 native macOS scaling A-B
on:
  push:
    branches: [fix/pr9666-native-mac-ab-20260908]
    paths: [.github/workflows/pr9666-native-mac.yml, .github/scripts/pr9666/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr9666-native-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-mac:
    if: github.repository == 'Imagineer99/unsloth' && github.ref == 'refs/heads/fix/pr9666-native-mac-ab-20260908'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Isolated analysis environment
        run: |
          python3 -m venv .pr9666-venv
          .pr9666-venv/bin/python -m pip install Pillow==11.3.0
      - name: Validate pinned sources in native windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: .pr9666-venv/bin/python .github/scripts/pr9666/run.py
      - name: Retain review artifacts including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr9666-native-mac-ab
          retention-days: 7
          if-no-files-found: error
          path: |
            temp/pr9666-native-artifacts/**/*.json
            temp/pr9666-native-artifacts/**/*.png
            temp/pr9666-native-artifacts/**/*.log
