# Disposable repro workflow. Delete after validation.

name: "PR 17291 macOS helper follow-up"

on:
  push:
    branches:
      - "fix/pr17291-cpu-eval-ab-20261109"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  macos-helper:
    name: "macOS helper portability (not full pipeline)"
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.11"
      - name: Create native CPU tensor environment
        shell: bash
        run: |
          python -m pip install uv==0.13.5
          python -m uv venv --python 3.12 .venv
          python -m uv pip install --python .venv/bin/python torch==2.11.0 packaging==26.3
          python -m uv pip check --python .venv/bin/python
      - name: Fetch and verify immutable base and head
        shell: bash
        run: .venv/bin/python prepare.py
      - name: Check exact helper and independent cross-entropy oracle
        shell: bash
        run: .venv/bin/python macos.py
