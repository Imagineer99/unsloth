# Disposable repro workflow. Delete after validation.

name: "PR 6944 Focused CI Rerun"

on:
  push:
    branches:
      - "fix/pr-6944-focused-ci-rerun"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install backend focused deps"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests 'numpy<3' pytest pytest-asyncio httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5'

      - name: "Backend seed upload tests"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest tests/test_data_recipe_seed.py -q --tb=short

      - name: "Upgrade npm to 11.x"
        shell: bash
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          npm -v

      - name: "Frontend dependency gates"
        shell: bash
        run: |
          python3 scripts/lockfile_supply_chain_audit.py
          python3 tests/studio/test_sync_allow_scripts_pins.py
          python3 scripts/sync_allow_scripts_pins.py --check

      - name: "Recipe Studio frontend typecheck and build"
        shell: bash
        run: |
          cd studio/frontend
          npm ci --strict-allow-scripts --no-fund --no-audit
          npm run typecheck
          npm run build

