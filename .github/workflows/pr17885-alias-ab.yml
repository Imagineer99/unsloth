name: PR 17885 alias A-B
on:
  push:
    branches: [feat/pr17885-alias-ab]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install -r .github/pr17885/requirements.txt
      - run: bash .github/pr17885/alias-ab.sh
