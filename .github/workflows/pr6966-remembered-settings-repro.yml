# Disposable repro workflow. Delete after validation.

name: "PR 6966 remembered settings repro"

on:
  push:
    branches:
      - "fix/pr-6966-remembered-settings-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Check last-used autoload remembered settings contract"
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          
          REPO = Path('.')
          adapter = (REPO / 'studio/frontend/src/features/chat/api/chat-adapter.ts').read_text()
          page = (REPO / 'studio/frontend/src/features/chat/chat-page.tsx').read_text()
          hook = (REPO / 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts').read_text()
          store = (REPO / 'studio/frontend/src/features/chat/stores/chat-runtime-store.ts').read_text()
          
          def function_body(src: str, signature: str) -> str:
              start = src.index(signature)
              brace = src.index('{', start)
              depth = 0
              for idx in range(brace, len(src)):
                  ch = src[idx]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return src[start:idx + 1]
              raise AssertionError(f'Could not find body for {signature}')
          
          # Baseline: interactive loads already have a remembered-settings path.
          assert 'loadRememberedLoadSettings(rememberedLoadSettingsKey(selection))' in page
          assert 'store.applyRememberedLoadSettings(remembered)' in page
          assert 'applyRememberedLoadSettings: (settings)' in store
          assert 'cache_type_kv: loadKvCacheDtype' in hook
          assert 'tensor_parallel: loadTensorParallel' in hook
          assert 'resolveLoadMaxSeqLength({' in hook
          
          body = function_body(adapter, 'async function loadAutoLoadCandidate')
          errors = []
          if 'loadRememberedLoadSettings' not in body and 'applyRememberedLoadSettings' not in body:
              errors.append('last-used auto-load helper does not read/apply remembered load settings')
          if 'cache_type_kv' not in body:
              errors.append('last-used auto-load loadModel request does not pass remembered KV cache dtype')
          if 'tensor_parallel' not in body:
              errors.append('last-used auto-load loadModel request does not pass remembered tensor parallel')
          if 'max_seq_length: candidate.maxSeqLength' in body and 'resolveLoadMaxSeqLength' not in body:
              errors.append('last-used auto-load still sends raw candidate.maxSeqLength instead of resolved remembered context')
          if errors:
              print('FAIL: remembered settings are not applied by last-used auto-load:')
              for error in errors:
                  print(f'- {error}')
              raise SystemExit(1)
          print('PASS: last-used auto-load applies remembered load settings')
          PY

