# Disposable A/B validation for upstream PR #9640. Do not merge.
name: PR 9640 A-B exception propagation

on:
  push:
    branches:
      - fix/pr-9640-ab-ui-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr9640-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    name: A-B (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Preserve probe outside checkout
        shell: bash
        run: cp .github/scripts/pr9640_ab_probe.py "${RUNNER_TEMP}/pr9640_ab_probe.py"

      - name: Fetch pinned A-B refs
        shell: bash
        run: |
          git fetch --no-tags https://github.com/unslothai/unsloth.git \
            b9792a5b14bd4bbf292d1a3b5404fb7654b50615 \
            d453a1986e85c18de64ce9b8b2f0ffd46a53fd54

      - name: BEFORE reproduces false Unknown tool
        shell: bash
        run: |
          git checkout --detach b9792a5b14bd4bbf292d1a3b5404fb7654b50615
          python "${RUNNER_TEMP}/pr9640_ab_probe.py" --mode before --repo . \
            | tee "${RUNNER_TEMP}/before.json"

      - name: AFTER propagates real errors and preserves controls
        shell: bash
        run: |
          git checkout --detach d453a1986e85c18de64ce9b8b2f0ffd46a53fd54
          python "${RUNNER_TEMP}/pr9640_ab_probe.py" --mode after --repo . \
            | tee "${RUNNER_TEMP}/after.json"

      - name: Upload A-B facts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr9640-ab-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
          if-no-files-found: warn
