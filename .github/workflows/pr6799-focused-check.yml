# Disposable focused validation for PR #6799. Delete after review.

name: PR 6799 Linux external folder check

on:
  push:
    branches:
      - fix/pr-6799-ci
  workflow_dispatch:

concurrency:
  group: pr-6799-focused-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-media-folders:
    name: Linux media folder guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio httpx

      - name: Run focused Linux external folder tests
        working-directory: studio/backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_linux_external_media_paths.py \
            hub/tests/test_model_services.py::test_resolve_browse_target_rejects_sensitive_dir \
            hub/tests/test_model_services.py::test_resolve_browse_target_rejects_sensitive_root \
            hub/tests/test_model_services.py::test_browse_folders_hides_sensitive_dirs \
            hub/tests/test_model_services.py::test_browse_allowlist_includes_linux_run_media_mounts

      - name: Direct path-policy sanity check
        working-directory: studio/backend
        run: |
