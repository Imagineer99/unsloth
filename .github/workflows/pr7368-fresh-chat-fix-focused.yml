name: PR 7368 fresh-chat restore fix verification

on:
  push:
    branches:
      - "fix/pr-7368-fresh-chat-fix-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-chat-fix:
    name: Fresh-chat first-save restore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Confirm the contract fails before the follow-up
        run: |
          git worktree add --detach /tmp/pr7368-before-fresh-chat-fix \
            afdafb83f70fe2b0af5ebacb38840fa4c67e79cb
          cp tests/studio/test_pr7368_fresh_chat_restore_fix.py /tmp/
          if PR7368_REPO_ROOT=/tmp/pr7368-before-fresh-chat-fix \
              python -m pytest -q \
              /tmp/test_pr7368_fresh_chat_restore_fix.py; then
            echo "::error::Fresh-chat contract unexpectedly passed before the fix"
            exit 1
          fi
          echo "Previous head reproduced the fresh-chat restore loss."

      - name: Verify the fresh-chat fix on current PR head
        run: |
          python -m pytest -q \
            tests/studio/test_pr7368_fresh_chat_restore_fix.py

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Upgrade npm for allowScripts enforcement
        run: npm install -g npm@^11 --no-fund --no-audit

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD

      - name: Typecheck
        working-directory: studio/frontend
        run: npm run typecheck

      - name: Production build
        working-directory: studio/frontend
        run: npm run build
