# Disposable repro workflow. Delete after validation.

name: "Hub GGUF Companion Fit A-B"

on:
  push:
    branches:
      - "fix/hub-gguf-companion-fit-repro-ci*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: "Install frontend dependencies"
        shell: bash
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          python3 scripts/lockfile_supply_chain_audit.py
          cd studio/frontend
          npm ci --strict-allow-scripts --no-fund --no-audit

      - name: "Muse Glimmer companion A/B probe"
        shell: bash
        run: |
          cd studio/frontend
          node --experimental-strip-types --test tests/gguf-companion-fit-repro.test.ts

      - name: "Frontend typecheck"
        shell: bash
        run: |
          cd studio/frontend
          npm run typecheck

      - name: "Full frontend unit suite"
        shell: bash
        run: |
          cd studio/frontend
          npm test
