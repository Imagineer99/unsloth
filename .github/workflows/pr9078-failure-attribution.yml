# Disposable repro workflow. Delete after validation.

name: "PR 9078 Failure Attribution"

on:
  push:
    branches:
      - "fix/pr9078-targeted-repro-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused test dependencies"
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest pytest-repeat

      - name: "Fetch exact comparison commits"
        shell: bash
        run: |
          git fetch --no-tags --depth=1 https://github.com/unslothai/unsloth.git \
            530799241698788a6c3625ea233024eba7de8281:refs/pr9078/base \
            refs/pull/9078/head:refs/pr9078/head
          test "$(git rev-parse refs/pr9078/base)" = 530799241698788a6c3625ea233024eba7de8281
          test "$(git rev-parse refs/pr9078/head)" = 3ee3b4dba7e399953cbdf4b08a168115bdc35bff

      - name: "Prove launcher sources are identical"
        shell: bash
        run: |
          git diff --exit-code 530799241698788a6c3625ea233024eba7de8281..3ee3b4dba7e399953cbdf4b08a168115bdc35bff -- tests/kaggle/test_launch_cleanup.py .github/scripts/kaggle_t4_ci/launch.py
          echo 'PASS launcher test and implementation are byte-identical across base and PR head'

      - name: "Materialize exact PR base"
        shell: bash
        run: |
          git worktree add "$RUNNER_TEMP/pr9078-base" 530799241698788a6c3625ea233024eba7de8281

      - name: "Prove base contract passes"
        shell: bash
        run: |
          python -m pytest -q "$RUNNER_TEMP/pr9078-base/tests/studio/test_deep_research_frontend_contract.py::test_research_website_limits_are_configurable_and_sent_with_each_run"
          echo 'PASS base contract accepts the base UI title'

      - name: "Prove PR head fails for the renamed title only"
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/studio/test_deep_research_frontend_contract.py::test_research_website_limits_are_configurable_and_sent_with_each_run > "$RUNNER_TEMP/head-before.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/head-before.log"
          test "$status" -ne 0
          grep -Fq '<DialogTitle>Website access</DialogTitle>' "$RUNNER_TEMP/head-before.log"
          grep -Fq '1 failed' "$RUNNER_TEMP/head-before.log"
          echo 'PASS PR head reproduces the stale title assertion and no broader focused failure'

      - name: "Prove one expectation update makes the contract green"
        shell: bash
        run: |
          sed -i 's#<DialogTitle>Website access</DialogTitle>#<DialogTitle>Deep research</DialogTitle>#' tests/studio/test_deep_research_frontend_contract.py
          python -m pytest -q tests/studio/test_deep_research_frontend_contract.py::test_research_website_limits_are_configurable_and_sent_with_each_run
          echo 'PASS changing only the expected title makes the PR contract pass'

      - name: "Stress unchanged SIGINT test on base and head"
        shell: bash
        run: |
          set +e
          timeout 180s python -m pytest -q --tb=no --count=100 "$RUNNER_TEMP/pr9078-base/tests/kaggle/test_launch_cleanup.py" -k 'a_signalled_launcher and SIGINT' > "$RUNNER_TEMP/base-signal.log" 2>&1
          base_status=$?
          timeout 180s python -m pytest -q --tb=no --count=100 tests/kaggle/test_launch_cleanup.py -k 'a_signalled_launcher and SIGINT' > "$RUNNER_TEMP/head-signal.log" 2>&1
          head_status=$?
          set -e
          cat "$RUNNER_TEMP/base-signal.log"
          cat "$RUNNER_TEMP/head-signal.log"
          echo "SIGNAL_STRESS base_status=$base_status head_status=$head_status"
          echo 'PASS signal stress is diagnostic only; source identity is the attribution proof'
