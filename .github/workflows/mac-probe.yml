name: "mac-probe pr-10597-xplat-ci"
on:
  push:
    branches: ["pr-10597-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - name: hf cache settings (exists on both arms)
        run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_hf_cache_settings.py -q --tb=line || true
      - name: hf cache settings, strict
        run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_hf_cache_settings.py -q --tb=no
