name: PR 7368 bot comment fix verification

on:
  push:
    branches:
      - "fix/pr-7368-bot-comments-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot-comment-fixes:
    name: Thread, Retry, and image-edit restore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Confirm all three findings reproduce before the follow-up
        run: |
          git worktree add --detach /tmp/pr7368-before-fixes \
            7e3134683dde7579118691980636312e8f378857
          cp tests/studio/test_pr7368_bot_comment_fixes.py /tmp/
          tests=(
            test_restore_is_scoped_to_the_source_draft
            test_only_a_direct_composer_send_can_arm_a_restore
            test_image_edit_restore_keeps_the_original_user_text
          )
          for test_name in "${tests[@]}"; do
            if PR7368_REPO_ROOT=/tmp/pr7368-before-fixes \
                python -m pytest -q \
                "/tmp/test_pr7368_bot_comment_fixes.py::${test_name}"; then
              echo "::error::${test_name} unexpectedly passed before the fix"
              exit 1
            fi
            echo "Reproduced before fix: ${test_name}"
          done

      - name: Verify all three fixes on the current PR
        run: python -m pytest -q tests/studio/test_pr7368_bot_comment_fixes.py

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Upgrade npm for allowScripts enforcement
        run: npm install -g npm@^11 --no-fund --no-audit

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD

      - name: Typecheck
        working-directory: studio/frontend
        run: npm run typecheck

      - name: Production build
        working-directory: studio/frontend
        run: npm run build
