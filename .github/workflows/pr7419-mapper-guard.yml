# Disposable repro workflow. Delete after validation.

name: "PR 7419 Mapper Guard"

on:
  push:
    branches:
      - "fix/pr-7419-mapper-repro-ci*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install pytest"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3

      - name: "Run mapper duplicate-key guard"
        shell: bash
        run: |
          python -m pytest -q tests/test_mapper_no_duplicate_keys.py

