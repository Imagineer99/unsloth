name: "staging-16569 macos-15"
on:
  push:
    branches: ["pr-16569-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart psutil
      - run: python -m pip install git+https://github.com/unslothai/unsloth-zoo mlx mlx-lm mlx-vlm gguf
      - run: python -c "import importlib.util as u, mlx.core as mx, mlx_lm; assert u.find_spec('unsloth_zoo'), 'unsloth_zoo missing'; print('mlx', mx.__version__, mx.default_device())"
      - run: PYTHONPATH=studio/backend python -m pytest @.github/staging/pr-16569-tests.txt -q || true
      - name: "jobs: install MLX (Apple Silicon)"
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          for attempt in 1 2 3; do python -m pip install "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo" && break; [ "$attempt" = 3 ] && exit 1; sleep $((5 * attempt)); done
          python -m pip install -e . --no-deps
          python -m pip install -U transformers mlx-vlm mlx-lm
          python -m pip list 2>/dev/null | grep -iE '^(transformers|mlx|mlx-lm|mlx-vlm|trl|peft|torch) '
      - name: "job: mlx_sft (MLX (Apple Silicon))"
        if: ${{ !cancelled() }}
        run: |
          env -u UNSLOTH_IS_PRESENT -u UNSLOTH_COMPILE_DISABLE -u UNSLOTH_FORCE_GPU_PATH python .github/scripts/jobs/mlx_sft.py --out job_0_mlx_sft_macos-15.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ always() }}
        with:
          name: job-results-macos-15
          path: job_*.json
          if-no-files-found: warn
