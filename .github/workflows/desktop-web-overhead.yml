name: Desktop versus web overhead experiment
on:
  push:
    branches: [feat/desktop-web-overhead-benchmark]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-web-overhead-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.repository == 'Imagineer99/unsloth'
    runs-on: windows-2022
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: studio/src-tauri -> target
          shared-key: desktop-web-overhead
          cache-on-failure: true
      - name: Audit dependency lockfiles
        run: python scripts/lockfile_supply_chain_audit.py
      - name: Install pinned Edge Beta for both rendering hosts
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'edge-beta.msi'
          Invoke-WebRequest 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/3751a255-17f0-4ce8-a1f2-a8a0f5e8f77e/MicrosoftEdgeBetaEnterpriseX64.msi' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '4E14083E81749BEF5D6E3DE166741DDDB057F6824406755BEDEA2B5EC01184A2') { throw 'Installer hash mismatch' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Invalid Microsoft signature' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart') -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "Installation failed: $($install.ExitCode)" }
          $edge = @("${env:ProgramFiles(x86)}/Microsoft/Edge Beta/Application/msedge.exe", "$env:ProgramFiles/Microsoft/Edge Beta/Application/msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$edge -or (Get-Item $edge).VersionInfo.ProductVersion -ne '154.0.4258.12') { throw 'Pinned Edge Beta not found' }
          "BENCH_EDGE=$edge" >> $env:GITHUB_ENV
          'BENCH_ENGINE_VERSION=154.0.4258.12' >> $env:GITHUB_ENV
      - name: Install backend from this checkout without model runtime
        run: |
          & ./install.ps1 --local --no-torch --skip-autostart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build optimized desktop with bundled production frontend
        run: |
          npm ci --prefix studio --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix studio/frontend --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --prefix studio tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install measurement tools
        run: python -m pip install playwright==1.56.0 psutil==7.1.0
      - name: Repeated headed desktop and Edge measurements
        run: |
          # Runtime 150+ ignores environment-supplied debugging switches for
          # elevated hosts. Scope the supported machine policy to our test exe.
          $policy = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name 'unsloth-studio.exe' -Value '--remote-debugging-port=9222' -PropertyType String -Force | Out-Null
          try {
            python .github/scripts/desktop_web_overhead.py --rounds 3 --seconds 30
            $benchmarkExit = $LASTEXITCODE
          } finally {
            Remove-ItemProperty -Path $policy -Name 'unsloth-studio.exe'
          }
          exit $benchmarkExit
      - name: Upload samples and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-web-overhead-${{ github.sha }}
          path: |
            benchmark-results/*.json
            benchmark-results/*.png
            benchmark-results/*.md
            benchmark-results/*-failed.txt
          if-no-files-found: warn
