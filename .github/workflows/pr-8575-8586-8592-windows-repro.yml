# Disposable repro workflow. Delete after validation.

name: "PR 8575 8586 8592 Windows Stack Repro"

on:
  push:
    branches:
      - "fix/windows-hardening-stack"
    paths-ignore:
      - ".github/workflows/windows-application-control-ci.yml"
      - ".github/workflows/pr-8575-8586-8592-virgin-windows.yml"
      - ".github/scripts/pr-stack-virgin-postinstall.ps1"
      - ".github/workflows/mugi-0-1-702-windows-package.yml"
      - ".github/scripts/mugi-windows-package-repro.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Report Windows toolchain"
        shell: pwsh
        run: |
          python --version
          node --version
          npm --version
          pwsh --version
          rustc --version
          cargo --version

      - name: "Install focused Python test dependencies"
        shell: pwsh
        run: |
          python -m venv .ci-venv
          $ciPython = Join-Path $PWD ".ci-venv\Scripts\python.exe"
          & $ciPython -m pip install -U pip pytest typer pyyaml pydantic click rich
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $ciPython -m pip install --no-deps -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Join-Path $PWD ".ci-venv\Scripts") |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: "Run stacked Windows Python hardening tests"
        shell: pwsh
        run: |
          $env:UNSLOTH_NO_TORCH = '1'
          python -m pytest tests/python/test_cross_platform_parity.py tests/python/test_windows_python_venv_hardening.py tests/python/test_windows_setup_output_encoding.py tests/python/test_module_entry_point.py tests/python/test_windows_installer_concurrency_guard.py tests/python/test_windows_studio_update_launcher.py tests/test_installer_skip_autostart.py tests/test_installer_system32_guard.py tests/test_installer_interactive_prompts.py tests/test_installer_profile_hardening.py tests/test_windows_amd_gpu_scan_fallback.py tests/studio/test_run_windows_entry_point.py tests/studio/test_installer_av_shapes.py tests/python/test_virustotal_scan.py tests/studio/test_tauri_installer_resource_contract.py -q -rs

      - name: "Run Application Control CLI fallback tests"
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/studio/test_application_control_cli_fallback.ps1

      - name: "Run installer rollback lifecycle tests"
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/studio/test_install_rollback_lifecycle.ps1

      - name: "Audit lockfiles"
        shell: pwsh
        run: |
          python scripts/lockfile_supply_chain_audit.py

      - name: "Build frontend and run stack-specific frontend tests"
        shell: pwsh
        run: |
          Push-Location studio/frontend
          try {
            npm ci --no-fund --no-audit
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            node --experimental-strip-types --test tests/backend-preflight-message.test.ts
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            npm run build
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: "Run full native Windows Rust unit tests"
        shell: pwsh
        run: |
          cargo test --manifest-path studio/src-tauri/Cargo.toml --no-fail-fast

      - name: "Check Windows release profile"
        shell: pwsh
        run: |
          cargo check --manifest-path studio/src-tauri/Cargo.toml --all-targets --release

