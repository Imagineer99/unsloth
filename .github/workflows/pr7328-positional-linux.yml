# Disposable repro workflow. Delete after validation.

name: "PR 7328 positional passthrough A-B (Linux)"

on:
  push:
    branches:
      - "fix/pr-7328-positional-repro-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install isolated CLI dependencies"
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check typer==0.27.0 click==8.3.1 rich==15.0.0

      - name: "Fetch exact pre-PR base"
        shell: bash
        run: |
          git init .pr7328-base
          git -C .pr7328-base remote add origin https://github.com/unslothai/unsloth.git
          git -C .pr7328-base fetch --depth=1 origin 4759a5139d3226289518e2e5e52d4ef573dcfed5
          git -C .pr7328-base checkout --detach FETCH_HEAD

      - name: "Pre-PR passthrough baseline"
        shell: bash
        run: |
          python .github/repro/pr7328_positional_passthrough.py baseline --repo .pr7328-base

      - name: "PR feature and path controls"
        shell: bash
        run: |
          python .github/repro/pr7328_positional_passthrough.py controls --repo .

      - name: "PR positional passthrough compatibility (expected failure)"
        shell: bash
        run: |
          python .github/repro/pr7328_positional_passthrough.py regression --repo .
