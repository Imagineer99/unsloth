# Disposable fork verification of the checkout fix. Tests real source routes and
# browser request/discovery helpers; does not launch the native Tauri shell.
name: Issue-12415-macOS-fix-validation

on:
  push:
    branches: [fix/issue-12415-macos-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Offline GGUF fix (${{ matrix.os }}, WebKit)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-webkit
      STUDIO_BROWSER: webkit
      UNSLOTH_SKIP_AUTOSTART: '1'
      UNSLOTH_STUDIO_DISABLE_DEVICE_PROBE: '1'
      UNSLOTH_ALLOW_CPU: '1'
      UNSLOTH_IS_PRESENT: '1'
      ISSUE_12415_VERIFY_FIX: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - name: Test frontend and bundle actual browser discovery helpers
        working-directory: studio/frontend
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test tests/gguf-local-discovery.test.ts tests/picker-gguf-discovery.test.ts tests/gguf-variants-request-bounds.test.ts tests/sole-quant-cache.test.ts tests/hub-network-availability.test.ts
          npm exec --yes --package esbuild@0.25.12 -- esbuild ../../.github/scripts/issue-12415-browser-entry.ts --bundle --alias:@=./src --outfile="$RUNNER_TEMP/issue-12415-browser.js"
          echo "ISSUE_12415_FRONTEND_BUNDLE=$RUNNER_TEMP/issue-12415-browser.js" >> "$GITHUB_ENV"
      - name: Install browser probe dependencies
        shell: bash
        run: |
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          python -m playwright install webkit
      - name: Install checkout Studio with local CPU GGUF runtime
        shell: bash
        run: |
          bash install.sh --local --no-torch --python 3.13
          backend_python="$UNSLOTH_STUDIO_HOME/unsloth_studio/bin/python"
          test -f "$backend_python"
          "$HOME/.local/bin/uv" pip install --python "$backend_python" pytest
          echo "ISSUE_12415_BACKEND_PYTHON=$backend_python" >> "$GITHUB_ENV"
      - name: Backend access and completeness regressions
        working-directory: studio/backend
        shell: bash
        run: |
          "$ISSUE_12415_BACKEND_PYTHON" -m pytest tests/test_on_device_gguf_discovery.py tests/test_cached_gguf_routes.py tests/test_hf_token_validation.py tests/test_hub_token_cache_isolation.py tests/test_account_model_access.py tests/test_local_options_account_access.py tests/test_gguf_refused_cached_load.py tests/test_training_cached_repo_authorization.py -q
      - name: Verify checkout routes and discovery helpers in WebKit, then local inference
        shell: bash
        run: python .github/scripts/issue-12415-macos-repro-probe.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-12415-offline-${{ matrix.os }}-webkit
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
          retention-days: 7
