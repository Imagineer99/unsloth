# Disposable repro workflow. Delete after validation.

name: "PR 9126 Tool Nudge Repro"

on:
  push:
    branches:
      - "fix/pr-9126-nudge-default-repro-ci*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install Studio test dependencies"
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r studio/backend/requirements/studio.txt

      - name: "Run tool-call nudge policy probe"
        shell: bash
        run: |
          cd studio/backend
          python ../../.github/scripts/pr-9126-nudge-default-probe.py
