name: "staging-13919 macos-15"
on:
  push:
    branches: ["pr-13919-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/code-block-containment-wiring.test.ts tests/code-fence-body.test.ts tests/code-fence-chunks.test.ts tests/code-fence-defer.test.ts tests/code-fence-foreground.test.ts tests/code-fence-mode.test.ts tests/code-fence-print.test.ts tests/code-fence-window.test.ts tests/desktop-webkit-paths.test.ts tests/fence-highlight-lifecycle.test.ts tests/fence-highlight-progress.test.ts tests/fence-highlight-queue.test.ts tests/fence-speculation-wiring.test.ts tests/fence-token-quiet-work.test.ts tests/highlight-worker-failover.test.ts tests/input-pointer-state.test.ts tests/plain-fence-chunks.test.ts tests/sidebar-inset-selectors.test.ts tests/sidebar-wrapper-children.test.ts
