# Disposable macOS reproduction. Success means known unwanted probes were observed
# and offline/access/completeness/inference controls passed, not that a fix is present.
# Uses the release's bundled installer and PyPI backend, via real route handlers
# in a browser harness. Does not launch the native packaged Tauri app.

name: "Issue-12415-macOS-offline-discovery"

on:
  push:
    branches:
      - "fix/issue-12415-macos-repro"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-studio:
    name: "Offline cached GGUF (${{ matrix.os }}, ${{ matrix.browser }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-15", "macos-15-intel"]
        browser: ["webkit"]
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-${{ matrix.browser }}
      STUDIO_BROWSER: ${{ matrix.browser }}
      UNSLOTH_SKIP_AUTOSTART: '1'
      ISSUE_12415_INSTALLED_BACKEND: '1'
      ISSUE_12415_RELEASE_TAG: 'v0.1.902-beta'
      ISSUE_12415_BACKEND_VERSION: '2026.9.14'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install Playwright dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps "${{ matrix.browser }}"
          else
            python -m playwright install "${{ matrix.browser }}"
          fi

      - name: Download and install the released backend (GGUF-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          release_dir="$RUNNER_TEMP/issue-12415-release"
          mkdir -p "$release_dir"
          gh release download "$ISSUE_12415_RELEASE_TAG" --repo unslothai/unsloth \
            --pattern latest.json --pattern Unsloth-Desktop-ARM64.app.tar.gz --dir "$release_dir"
          gh api "repos/unslothai/unsloth/releases/tags/$ISSUE_12415_RELEASE_TAG" > "$release_dir/release.json"
          python .github/scripts/issue-12415-release-install.py

      - name: Exercise real Studio routes through WebKit and run local inference
        shell: bash
        run: |
          python ".github/scripts/issue-12415-macos-repro-probe.py"

      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-12415-offline-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
          retention-days: 7
