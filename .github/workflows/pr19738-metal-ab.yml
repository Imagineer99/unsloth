name: PR 19738 MLX chat A-B
on:
  push:
    branches: ["fix/pr19738-mlx-progress-ab"]
    paths: [".github/workflows/pr19738-metal-ab.yml", "scripts/pr19738/**"]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'Imagineer99/unsloth'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      BEFORE: 8e51691b644340472aa2e1fbb73ce3d7f847936c
      AFTER: 222dcd588ee5407b5d6a8766f2d4579ede267a55
      ZOO: 348d0397612c61852f8a3b360ca1ac50630d2fdb
      MODEL_SHA: 3067585164dbcc505eec73d554349de6a27571a4
      MODEL_ID: mlx-community/Qwen3.5-0.8B-bf16
      HF_HUB_DISABLE_TELEMETRY: "1"
      UNSLOTH_DISABLE_MLX_AUTOREPAIR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify native Metal computation
        run: |
          python -m venv "$RUNNER_TEMP/ab-venv"
          source "$RUNNER_TEMP/ab-venv/bin/activate"
          python -m pip -q install uv mlx==0.32.4
          python - <<'PY'
          import platform
          import mlx.core as mx
          print("machine", platform.machine(), "Metal available", mx.metal.is_available(), flush=True)
          assert platform.machine() == "arm64" and mx.metal.is_available(), "INCONCLUSIVE: runner has no Metal device"
          mx.set_default_device(mx.gpu)
          x = mx.ones((32, 32))
          assert (x @ x)[0, 0].item() == 32
          print("Metal matrix multiplication passed", flush=True)
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install pinned sides and run the browser comparison
        run: bash scripts/pr19738/run.sh
