# Disposable focused validation for PR #6790. Delete after review.

name: PR 6790 llama-server load progress check

on:
  push:
    branches:
      - fix/pr-6790-focused-ci
  workflow_dispatch:

concurrency:
  group: pr-6790-focused-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load-progress:
    name: llama-server health and progress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio httpx

      - name: Run focused llama-server progress tests
        working-directory: studio/backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_load_progress_ready_fraction.py \
            tests/test_llama_cpp_wait_for_health.py::TestWaitForHealthResilience::test_timeout_records_marker_for_classification \
            tests/test_llama_cpp_start_failure_classification.py::TestOllamaAndFallback::test_health_timeout_names_probe_not_generic

      - name: Direct ready/monotonic progress probe
        working-directory: studio/backend
        run: |
          python - <<'PY'
          import sys
          import types
          from pathlib import Path

