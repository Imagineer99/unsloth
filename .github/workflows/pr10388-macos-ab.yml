name: PR 10388 macOS pinned A-B
on:
  push:
    branches: [fix/pr10388-macos-ab-20260907]
permissions:
  contents: read
jobs:
  macos-ab:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Checkout pinned BEFORE
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: unslothai/unsloth
          ref: 919922c416a58e777d8f1afc4c8142e6070ae951
          path: temp/before
          persist-credentials: false
      - name: Checkout pinned AFTER
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: unslothai/unsloth
          ref: 0a2be3584cfdb4357af3e1864cbe49574fb65b8b
          path: temp/after
          persist-credentials: false
      - name: Isolated minimal test environment
        run: |
          python -m venv temp/venv
          temp/venv/bin/python -m pip install pytest==9.1.1 pytest-timeout==2.4.0 structlog==26.1.0
      - name: Require exact negative and positive outcomes
        run: temp/venv/bin/python harness/run_ab.py --before temp/before --after temp/after --output temp/results
