# Disposable PR 9636 A/B workflow. Delete with its staging branches.
name: PR 9636 MCP Embedded Resource A-B

on:
  push:
    branches:
      - "fix/pr-9636-mcp-repro-base"
      - "fix/pr-9636-mcp-repro-head"
      - "fix/pr-9636-mcp-repro-uri-fixed"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-fastmcp:
    name: "${{ matrix.os }} / Python ${{ matrix.python }} / FastMCP ${{ matrix.fastmcp }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PR9636_PRODUCT_SHA: ${{ github.ref_name == 'fix/pr-9636-mcp-repro-base' && '785a68dc4d193cc0a7f4706dcfe7b14a5e433e2f' || github.ref_name == 'fix/pr-9636-mcp-repro-head' && '91cbdb6a0cb1d14ca11c5c9be3f3942518687f14' || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - python: "3.10"
            fastmcp: "3.0.2"
          - python: "3.13"
            fastmcp: "3.4.5"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "${{ matrix.python }}"

      - name: Install pinned MCP dependencies
        shell: bash
        run: |
          python -m pip install "fastmcp==${{ matrix.fastmcp }}" "mcp==1.29.0"

      - name: Run real FastMCP A/B probe
        shell: bash
        run: |
          python .github/scripts/pr9636_ab_probe.py \
            --repo "$GITHUB_WORKSPACE" \
            --output "artifacts/pr9636-ab/${{ matrix.os }}-py${{ matrix.python }}.json"

      - name: Upload A/B report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "pr9636-ab-${{ matrix.os }}-py${{ matrix.python }}"
          path: artifacts/pr9636-ab
          if-no-files-found: error
