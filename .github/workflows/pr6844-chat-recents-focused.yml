# Disposable focused validation for PR #6844. Delete after review.

name: PR 6844 chat recents sort focused check

on:
  push:
    branches:
      - fix/pr-6844-chat-recents-ci
  workflow_dispatch:

concurrency:
  group: pr-6844-chat-recents-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chat-recents:
    name: Chat recents last-activity ordering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install focused backend test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install pytest pyyaml jinja2 requests

      - name: Backend updated_at ordering regression tests
        working-directory: studio/backend
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_chat_history_storage.py \
            -k 'updated_at or last_activity or migration'

      - name: Frontend sidebar source assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hook = Path("studio/frontend/src/features/chat/hooks/use-chat-sidebar-items.ts").read_text()
          types = Path("studio/frontend/src/features/chat/types.ts").read_text()
          api_storage = Path("studio/frontend/src/features/chat/utils/chat-history-storage.ts").read_text()

          for needle in (
              "function lastActivityAt(thread: ThreadRecord): number",
              "return thread.updatedAt ?? thread.createdAt;",
              "updatedAt: lastActivityAt(t)",
              "existing.updatedAt = Math.max(existing.updatedAt, lastActivityAt(t));",
              "return items.sort((a, b) => b.updatedAt - a.updatedAt);",
          ):
              assert needle in hook, f"sidebar grouping missing {needle!r}"

          assert "updatedAt?: number;" in types, "ThreadRecord must carry optional backend updatedAt"
          assert "updatedAt" in api_storage, "chat history storage must preserve updatedAt from backend records"
          print("PASS: frontend sidebar groups and sorts recents by last activity")
          PY

      - name: Render chat recents screenshot fixture
        run: |
          set -euo pipefail
          pip install 'playwright>=1.55,<1.58'
          python -m playwright install --with-deps chromium
          mkdir -p logs/pr6844-chat-recents-screenshots
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path("logs/pr6844-chat-recents-screenshots")
          threads = [
              {
                  "title": "Fresh empty chat",
                  "created": 1_700_000_300_000,
                  "updated": 1_700_000_300_000,
                  "note": "newest createdAt, no messages",
                  "accent": "#64748b",
              },
              {
                  "title": "Older chat with newest reply",
                  "created": 1_700_000_000_000,
                  "updated": 1_700_000_500_000,
                  "note": "older createdAt, latest message activity",
                  "accent": "#16a34a",
              },
              {
                  "title": "Compare pair",
                  "created": 1_700_000_100_000,
                  "updated": 1_700_000_400_000,
                  "note": "pair updated by one side",
                  "accent": "#2563eb",
              },
          ]
          before = sorted(threads, key=lambda t: t["created"], reverse=True)
          after = sorted(threads, key=lambda t: t["updated"], reverse=True)
          assert [t["title"] for t in after] == [
              "Older chat with newest reply",
              "Compare pair",
              "Fresh empty chat",
          ]

          def row(t, idx, key):
              return f'''
              <li class="chat-row" style="--accent: {t['accent']}">
                <span class="rank">{idx}</span>
                <span class="title">{t['title']}</span>
                <span class="meta">{t['note']}</span>
                <span class="time">{key}: {t[key]}</span>
              </li>'''

          html = f'''<!doctype html>
          <html>
          <head>
            <meta charset="utf-8" />
            <title>PR 6844 chat recents ordering</title>
            <style>
              body {{ margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }}
              main {{ width: 1180px; padding: 32px; }}
              h1 {{ font-size: 28px; margin: 0 0 8px; letter-spacing: 0; }}
              p {{ margin: 0 0 24px; color: #475569; font-size: 15px; }}
              .grid {{ display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }}
              section {{ background: white; border: 1px solid #dbe3ef; border-radius: 8px; padding: 18px; box-shadow: 0 10px 28px rgba(15, 23, 42, .08); }}
              h2 {{ font-size: 17px; margin: 0 0 14px; letter-spacing: 0; }}
              ol {{ list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }}
              .chat-row {{ display: grid; grid-template-columns: 34px 1fr; grid-template-areas: "rank title" "rank meta" "rank time"; gap: 2px 12px; padding: 12px; border: 1px solid #e2e8f0; border-left: 4px solid var(--accent); border-radius: 7px; background: #fff; }}
              .rank {{ grid-area: rank; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 999px; background: #e2e8f0; color: #334155; font-weight: 700; }}
              .title {{ grid-area: title; font-weight: 700; font-size: 15px; }}
              .meta {{ grid-area: meta; color: #475569; font-size: 13px; }}
              .time {{ grid-area: time; color: #64748b; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }}
              .pass {{ margin-top: 16px; border: 1px solid #bbf7d0; background: #f0fdf4; color: #166534; padding: 10px 12px; border-radius: 7px; font-weight: 700; }}
            </style>
          </head>
          <body>
            <main>
              <h1>PR #6844 chat recents ordering</h1>
              <p>Fixture proves the expected sidebar order after sorting by last activity instead of creation time.</p>
              <div class="grid">
                <section>
                  <h2>Old behavior: createdAt DESC</h2>
                  <ol>{''.join(row(t, i + 1, 'created') for i, t in enumerate(before))}</ol>
                </section>
                <section>
                  <h2>PR behavior: updatedAt DESC</h2>
                  <ol>{''.join(row(t, i + 1, 'updated') for i, t in enumerate(after))}</ol>
                  <div class="pass">PASS: older chat moves to the top after newest message activity</div>
                </section>
              </div>
            </main>
          </body>
          </html>'''
          (out / "chat-recents-order.html").write_text(html)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1240, "height": 760}, device_scale_factor=1)
              page.goto((out / "chat-recents-order.html").resolve().as_uri())
              page.screenshot(path=str(out / "chat-recents-order.png"), full_page=True)
              page.locator("section").nth(1).screenshot(path=str(out / "chat-recents-after-only.png"))
              browser.close()
          print("PASS: rendered chat recents screenshots")
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr6844-chat-recents-screenshots
          path: logs/pr6844-chat-recents-screenshots
          if-no-files-found: error
