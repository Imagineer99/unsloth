name: PR 10096 independent TCP disconnect A-B

on:
  push:
    branches:
      - 'fix/pr-10096-disconnect-repro-ci-20260902-*'
  workflow_dispatch:

concurrency:
  group: pr-10096-independent-repro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tcp-disconnect:
    name: real TCP reset and queue release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify pinned product parent
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            *-before) expected=2da377132c65b7580a658a95005693988d7f2515 ;;
            *-after) expected=9c434aeab25b0eea7ecf3a6554c095f8c3e47264 ;;
            *) echo "Unexpected branch: $GITHUB_REF_NAME"; exit 2 ;;
          esac
          actual="$(git rev-parse HEAD^)"
          echo "branch=$GITHUB_REF_NAME"
          echo "workflow_sha=$GITHUB_SHA"
          echo "product_parent=$actual"
          test "$actual" = "$expected"

      - name: Install CPU-only backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"

      - name: Run real TCP reset probe
        working-directory: studio/backend
        run: |
          python -m pytest tests/test_pr10096_tcp_disconnect_repro.py \
            -p no:randomly -q -s --timeout=300
