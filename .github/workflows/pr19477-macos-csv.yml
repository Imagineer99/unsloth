name: PR 19477 macOS CSV A/B
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr19477-macos-csv.yml'
      - '.github/probes/pr19477_csv.py'
permissions:
  contents: read
jobs:
  csv:
    if: github.repository == 'Imagineer99/unsloth' && github.head_ref == 'fix/pr19477-macos-csv-ab-b312519'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      BASE_SHA: 6a4837c94fd88e1105f8f856c0094ff46af955d1
      HEAD_SHA: b312519fdab340b612977a24a6b8bdd22a146219
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: unslothai/unsloth
          ref: ${{ env.BASE_SHA }}
          path: before
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: unslothai/unsloth
          ref: ${{ env.HEAD_SHA }}
          path: after
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU evaluation dependencies
        run: |
          python -m venv "$RUNNER_TEMP/csv-env"
          "$RUNNER_TEMP/csv-env/bin/python" -m pip install --disable-pip-version-check \
            lm-eval==0.4.13 datasets==4.3.0 pandas==2.3.3 torch==2.15.0 pyarrow==26.0.1 \
            typer==0.27.1 'pydantic>=2,<3' click 'transformers==4.56.2' pyyaml
      - name: Base scores and metadata
        run: '"$RUNNER_TEMP/csv-env/bin/python" .github/probes/pr19477_csv.py base "$BASE_SHA" before "$RUNNER_TEMP/base-csv"'
      - name: PR scores and metadata
        run: '"$RUNNER_TEMP/csv-env/bin/python" .github/probes/pr19477_csv.py head "$HEAD_SHA" after "$RUNNER_TEMP/head-csv"'
