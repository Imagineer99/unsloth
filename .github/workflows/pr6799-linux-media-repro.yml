# Disposable repro workflow. Delete after validation.

name: "PR 6799 Linux Media Repro"

on:
  push:
    branches:
      - "fix/pr6799-repro-ci*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused test dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest structlog starlette fastapi

      - name: "Run A/B Linux media scan-folder probe"
        shell: bash
        run: |
          git remote add upstream https://github.com/unslothai/unsloth.git || true
          git fetch --depth=1 upstream main
          git worktree add /tmp/pr6799-main upstream/main
          python .github/scripts/pr6799_linux_media_probe.py --repo /tmp/pr6799-main --mode main-negative
          python .github/scripts/pr6799_linux_media_probe.py --repo "$GITHUB_WORKSPACE" --mode pr-positive

      - name: "Run focused regression tests"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest tests/test_linux_external_media_paths.py -q
          python -m pytest hub/tests/test_model_services.py -q
