name: PR 10649 targeted A-B
on:
  push:
    branches: [fix/pr10649-targeted-ab-20260910]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unslothai/unsloth
          ref: 191b69c12b4434b5247f1fd7a455b4a760b169ae
          path: sources/base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unslothai/unsloth
          ref: b675a9d70a9514bbdcb95b98fe41242313c0707b
          path: sources/head
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.1
      - name: Execute isolated A-B fixtures
        run: python run.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr10649-ab-${{ matrix.os }}
          path: temp/ab/results
          retention-days: 14
          if-no-files-found: error
