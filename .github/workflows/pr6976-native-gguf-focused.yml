# Disposable repro workflow. Delete after validation.

name: "PR 6976 native GGUF focused CI"

on:
  push:
    branches:
      - "fix/pr-6976-focused-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install pytest"
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest

      - name: "Run native GGUF reload contract test"
        shell: bash
        run: |
          python -m pytest tests/studio/test_chat_native_gguf_reload_contract.py -q

