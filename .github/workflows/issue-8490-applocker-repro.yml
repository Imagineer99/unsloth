# Disposable reproduction for issue #8490. This deliberately installs a local
# AppLocker deny rule for only the generated unsloth.exe console launcher. The
# runner is ephemeral, and the policy is still removed in the final cleanup.
name: Issue 8490 Windows AppLocker repro

on:
  workflow_dispatch:
  push:
    branches:
      - fix/issue-8490-applocker-repro-ci

permissions:
  contents: read

jobs:
  reproduce:
    name: desktop installer / blocked unsloth.exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the managed install and generated launcher
        shell: powershell
        env:
          UNSLOTH_VERBOSE: '1'
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path logs | Out-Null

          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\install.ps1 --tauri --no-torch *>&1 |
            Tee-Object -FilePath logs\baseline-install.log
          $installerExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($installerExit -ne 0) {
            Write-Host "::error::Baseline desktop install failed with exit $installerExit."
            exit 1
          }

          $unslothExe = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\unsloth.exe'
          if (-not (Test-Path -LiteralPath $unslothExe -PathType Leaf)) {
            Write-Host "::error::Baseline install did not create $unslothExe."
            exit 1
          }
          Write-Host "Baseline install created: $unslothExe"

      - name: Enforce a narrow AppLocker deny rule for a standard user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $probeUser = 'AppLockerProbe'
          $probePassword = 'Issue8490-AppLocker-Probe!'
          & net.exe user $probeUser $probePassword /add /passwordchg:no
          if ($LASTEXITCODE -ne 0) { throw "Could not create $probeUser (exit $LASTEXITCODE)" }
          $probeAccount = [System.Security.Principal.NTAccount]::new($env:COMPUTERNAME, $probeUser)
          $probeSid = $probeAccount.Translate(
            [System.Security.Principal.SecurityIdentifier]
          ).Value

          $blockedExe = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\unsloth.exe'
          $escapedBlockedExe = [System.Security.SecurityElement]::Escape($blockedExe)
          $allowId = [guid]::NewGuid()
          $denyId = [guid]::NewGuid()
          $policy = @"
          <AppLockerPolicy Version="1">
            <RuleCollection Type="Exe" EnforcementMode="Enabled">
              <FilePathRule Id="$allowId" Name="Allow all other executables" Description="Keep the probe user usable" UserOrGroupSid="$probeSid" Action="Allow">
                <Conditions>
                  <FilePathCondition Path="*" />
                </Conditions>
              </FilePathRule>
              <FilePathRule Id="$denyId" Name="Block generated Unsloth console launcher" Description="Reproduce issue 8490" UserOrGroupSid="$probeSid" Action="Deny">
                <Conditions>
                  <FilePathCondition Path="$escapedBlockedExe" />
                </Conditions>
              </FilePathRule>
            </RuleCollection>
          </AppLockerPolicy>
          "@
          $policyPath = Join-Path $PWD 'logs\applocker-policy.xml'
          $policy | Set-Content -LiteralPath $policyPath -Encoding UTF8

          & sc.exe config AppIDSvc start= auto
          if ($LASTEXITCODE -ne 0) { throw "Could not configure AppIDSvc (exit $LASTEXITCODE)" }
          Start-Service -Name AppIDSvc
          Set-AppLockerPolicy -XmlPolicy $policyPath
          & gpupdate.exe /target:computer /force
          if ($LASTEXITCODE -ne 0) { throw "gpupdate failed (exit $LASTEXITCODE)" }

          Get-AppLockerPolicy -Effective -Xml |
            Set-Content -LiteralPath logs\applocker-effective.xml -Encoding UTF8

          $probeIdentity = "$env:COMPUTERNAME\$probeUser"
          Test-AppLockerPolicy -XmlPolicy $policyPath -Path $blockedExe -User $probeIdentity |
            Format-List * | Out-File -LiteralPath logs\applocker-test.txt -Encoding utf8
          $policyTest = Get-Content -LiteralPath logs\applocker-test.txt -Raw
          if ($policyTest -notmatch 'Denied') {
            throw "Test-AppLockerPolicy did not deny $blockedExe for $probeIdentity.`n$policyTest"
          }

          & icacls.exe (Join-Path $env:USERPROFILE '.unsloth') `
            /grant "${probeUser}:(OI)(CI)M" /T /C | Out-File logs\icacls.txt
          if ($LASTEXITCODE -ne 0) { throw "Could not grant the probe user access (exit $LASTEXITCODE)" }
          Write-Host "AppLocker will block only $blockedExe for standard user $probeIdentity."

      - name: Re-run the desktop installer as the standard user
        shell: powershell
        env:
          UNSLOTH_VERBOSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          (Get-Date).ToString('o') | Set-Content -LiteralPath logs\install-started-at.txt

          $probeRoot = 'C:\Users\Public\issue-8490-applocker-repro'
          New-Item -ItemType Directory -Force -Path $probeRoot | Out-Null
          Copy-Item -LiteralPath .\install.ps1 -Destination (Join-Path $probeRoot 'install.ps1') -Force
          $wrapper = @'
          $ErrorActionPreference = 'Continue'
          $env:USERPROFILE = $env:UNSLOTH_REPRO_PROFILE
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File $env:UNSLOTH_REPRO_INSTALLER --tauri --no-torch *>&1 |
            Tee-Object -FilePath C:\Users\Public\issue-8490-applocker-repro\install.log
          exit $LASTEXITCODE
          '@
          $wrapperPath = Join-Path $probeRoot 'invoke-installer.ps1'
          $wrapper | Set-Content -LiteralPath $wrapperPath -Encoding UTF8

          $env:UNSLOTH_REPRO_PROFILE = $env:USERPROFILE
          $env:UNSLOTH_REPRO_INSTALLER = Join-Path $probeRoot 'install.ps1'
          $securePassword = ConvertTo-SecureString 'Issue8490-AppLocker-Probe!' -AsPlainText -Force
          $credential = [System.Management.Automation.PSCredential]::new(
            "$env:COMPUTERNAME\AppLockerProbe",
            $securePassword
          )
          $process = Start-Process -FilePath powershell.exe `
            -ArgumentList @('-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $wrapperPath) `
            -Credential $credential -LoadUserProfile -WorkingDirectory $probeRoot -Wait -PassThru
          $installerExit = $process.ExitCode
          Copy-Item -LiteralPath (Join-Path $probeRoot 'install.log') -Destination logs\install.log
          $installerExit | Set-Content -LiteralPath logs\installer-exit-code.txt

          if ($installerExit -eq 0) {
            Write-Host '::error::The installer unexpectedly succeeded; AppLocker did not reproduce issue 8490.'
            exit 1
          }

          $installLog = Get-Content -LiteralPath logs\install.log -Raw
          if ($installLog -notmatch 'Running studio setup') {
            Write-Host '::error::The installer failed before the issue 8490 handoff.'
            exit 1
          }
          if ($installLog -notmatch 'Application Control policy|blocked by group policy|NativeCommandFailed') {
            Write-Host '::error::The installer failed at studio setup, but its diagnostics do not show an application-control failure.'
            exit 1
          }

          Write-Host "PASS: installer reached studio setup and unsloth.exe was blocked (exit $installerExit)."

      - name: Require an AppLocker block event for unsloth.exe
        if: always()
        shell: powershell
        run: |
          $startedAt = [datetime](Get-Content -LiteralPath logs\install-started-at.txt -Raw)
          $events = @(
            Get-WinEvent -FilterHashtable @{
              LogName = 'Microsoft-Windows-AppLocker/EXE and DLL'
              StartTime = $startedAt.AddSeconds(-5)
            } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'unsloth\.exe' }
          )
          $events | Format-List TimeCreated, Id, LevelDisplayName, Message |
            Out-File -LiteralPath logs\applocker-events.txt -Encoding utf8 -Width 300

          if ($events.Count -eq 0) {
            Write-Host '::error::No AppLocker event naming unsloth.exe was recorded.'
            exit 1
          }
          $events | ForEach-Object {
            Write-Host "AppLocker event $($_.Id): $($_.Message)"
          }
          Write-Host 'PASS: Windows recorded the unsloth.exe policy block.'

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-8490-applocker-repro
          path: logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Remove the local AppLocker policy
        if: always()
        shell: powershell
        run: |
          $emptyPolicy = Join-Path $env:RUNNER_TEMP 'empty-applocker-policy.xml'
          '<AppLockerPolicy Version="1" />' |
            Set-Content -LiteralPath $emptyPolicy -Encoding UTF8
          Set-AppLockerPolicy -XmlPolicy $emptyPolicy
          Stop-Service -Name AppIDSvc -Force -ErrorAction SilentlyContinue
          & net.exe user AppLockerProbe /delete 2>&1 | Out-Null
