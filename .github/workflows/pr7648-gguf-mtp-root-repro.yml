name: PR 7648 GGUF MTP Root A-B Repro

on:
  pull_request:
    branches: [fix/pr7648-repro-ci-base]
    paths:
      - '.github/workflows/pr7648-gguf-mtp-root-repro.yml'
      - '.github/pr-repro/pr7648_gguf_mtp_root_probe.py'
  workflow_dispatch:

concurrency:
  group: pr-7648-gguf-mtp-root-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ab-repro:
    name: ${{ matrix.os }} / ${{ matrix.revision }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        revision: [before, after]
        include:
          - revision: before
            source_ref: 969e32f8ae91d252d4dc57d7a920cd4d1866247a
            run_focused: ''
          - revision: after
            source_ref: refs/pull/7648/head
            run_focused: '--run-focused'

    steps:
      - name: Check out repro harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: harness
          persist-credentials: false

      - name: Check out exact ${{ matrix.revision }} source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: unslothai/unsloth
          ref: ${{ matrix.source_ref }}
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv==0.11.33

      - name: Prove expected ${{ matrix.revision }} behavior
        env:
          PYTHONUTF8: '1'
        run: >-
          uv run --isolated --no-project --python 3.12
          --with-requirements source/studio/backend/requirements/studio.txt
          --with python-multipart --with aiofiles --with sqlalchemy
          --with cryptography --with psutil --with pyyaml --with jinja2
          --with mammoth --with unpdf --with requests --with 'numpy<3'
          --with pytest --with pytest-asyncio --with httpx
          python harness/.github/pr-repro/pr7648_gguf_mtp_root_probe.py
          --backend source/studio/backend
          --expect ${{ matrix.revision }}
          ${{ matrix.run_focused }}
