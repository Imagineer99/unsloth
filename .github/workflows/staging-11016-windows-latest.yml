name: "staging-11016 windows-latest"
on:
  push:
    branches: ["pr-11016-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install packaging pyyaml ruff==0.6.9
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/notebooks/test_colab_oracle_drift.py tests/notebooks/test_notebook_validator_shell_parsing.py tests/notebooks/test_smoke_install_contract.py tests/studio/install/test_dependency_pass_skips.py tests/studio/install/test_transformers_tokenizers_pair.py tests/studio/test_backend_ci_matrix.py tests/studio/test_backend_ci_parallel_isolation.py tests/studio/test_cache_budget_discipline.py tests/studio/test_ci_shell_suite_coverage.py tests/studio/test_compile_caches_are_per_worker.py tests/studio/test_local_actions_are_in_path_filters.py tests/studio/test_main_runs_survive_merge_bursts.py tests/studio/test_short_job_absorption.py tests/studio/test_version_compat_bundle.py tests/test_formatter_fixed_point.py tests/test_transformers_cap_sites.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && ! grep -qE "^FAILED " pytest_out.txt; then err=$(grep -cE "^ERROR " pytest_out.txt || true); dep=$(grep -cE "No module named .(torch|unsloth_zoo|transformers).|Unsloth. torch not found" pytest_out.txt || true); if [ "$dep" -gt 0 ] && [ "$dep" -ge "$err" ]; then echo "collection needs a dep this runner does not ship"; rc=0; fi; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt || true); dep=$(grep -cE "^FAILED .*(No module named .(torch|unsloth_zoo|transformers).|Unsloth. torch not found)" pytest_out.txt || true); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
