name: PR 6796 resume training focused check

on:
  push:
    branches:
      - fix/pr-6796-ci-20260720142911

permissions:
  contents: read

jobs:
  resume-training:
    name: Resume, cancellation, and MLX checkpoint tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            "numpy<3" pytest pytest-asyncio httpx ruff
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch>=2.4,<2.11"

      - name: Run focused resume and finalization tests
        working-directory: studio/backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_training_resume.py \
            tests/test_training_pump_resilience.py \
            tests/test_training_stop_watchdog.py \
            tests/test_mlx_stop_checkpoint.py

      - name: Ruff changed backend files
        run: |
          ruff check \
            studio/backend/core/training/resume.py \
            studio/backend/core/training/training.py \
            studio/backend/core/training/worker.py \
            studio/backend/models/training.py \
            studio/backend/routes/training.py \
            studio/backend/storage/studio_db.py \
            studio/backend/tests/test_training_resume.py \
            studio/backend/tests/test_training_pump_resilience.py \
            studio/backend/tests/test_training_stop_watchdog.py \
            studio/backend/tests/test_mlx_stop_checkpoint.py

  resume-ui:
    name: Resume history UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint changed resume UI files
        run: |
          npx eslint \
            src/features/studio/historical-training-view.tsx \
            src/features/studio/history-card-grid.tsx \
            src/features/studio/studio-page.tsx \
            src/features/training/stores/training-runtime-store.ts \
            src/features/training/types/runtime.ts \
            src/i18n/locales/en.ts \
            src/i18n/locales/zh-CN.ts
