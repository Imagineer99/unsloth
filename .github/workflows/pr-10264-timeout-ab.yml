name: PR 10264 Hub timeout A/B proof

on:
  push:
    branches:
      - fix/pr-10264-timeout-ab-repro-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeout-ab:
    name: ${{ matrix.os }} / huggingface_hub ${{ matrix.hf_hub }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        hf_hub:
          - "0.36.2"
          - "1.23.0"
          - "1.30.0"

    steps:
      - name: Check out exact PR proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install selected Hub client
        run: python -m pip install --disable-pip-version-check "huggingface-hub==${{ matrix.hf_hub }}"

      - name: Run controlled before/after timeout proof
        run: python tests/repro/pr10264_timeout_ab.py --repo . --deadline 13
