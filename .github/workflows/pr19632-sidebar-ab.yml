name: PR 19632 sidebar sync A/B
on:
  push:
    branches: [fix/pr19632-sidebar-browser-ab]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unslothai/unsloth
          ref: 30c8e8898e77df304fd2ac3b2ed05569f6560f29
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Imagineer99/unsloth
          ref: 4b395272afdb1122b0665c58feac2cb587d844e1
          path: head
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install chromium
      - name: Before, isolated local section
        working-directory: base
        run: bash ../.github/sidebar-ab/run.sh base 30c8e8898e77df304fd2ac3b2ed05569f6560f29 18890
      - name: After, section from the authenticated account
        working-directory: head
        run: bash ../.github/sidebar-ab/run.sh head 4b395272afdb1122b0665c58feac2cb587d844e1 18891
