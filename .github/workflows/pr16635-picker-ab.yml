# Disposable repro workflow. Delete after validation.

name: "PR 16635 picker review-fix A-B"

on:
  push:
    branches:
      - "fix/pr16635-picker-ab-20261104"

permissions:
  contents: read

jobs:
  repro:
    name: "CLI A/B (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Checkout BEFORE
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: unslothai/unsloth
          ref: f22d2cfb153516bc3e2c69ffaa6519341f32e7ca
          path: before
          persist-credentials: false

      - name: Checkout AFTER
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Imagineer99/unsloth
          ref: 1354c9db47ef77f0630969f8d3291918e6a6c574
          path: after
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13.17"

      - name: "Prove review fixes with native terminals and negative controls"
        shell: pwsh
        run: |
          python scripts/pr16635_validation.py bootstrap --before before --after after
