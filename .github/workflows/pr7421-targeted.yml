# Disposable repro workflow. Delete after validation.

name: "PR 7421 Targeted CI"

on:
  push:
    branches:
      - "pr-7421-targeted-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused test dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8" "typer>=0.12" click rich "pydantic>=2" pyyaml nest-asyncio httpx fastapi pyjwt

      - name: "Run PR 7421 focused tests"
        shell: bash
        run: |
          env -u FORCE_COLOR NO_COLOR=1 python -m pytest -q unsloth_cli/tests/test_start.py unsloth_cli/tests/test_studio_run_parallel_flag.py studio/backend/tests/test_gpu_memory_mode.py studio/backend/tests/test_llama_server_args.py --deselect 'unsloth_cli/tests/test_studio_run_parallel_flag.py::test_reexec_forwards_api_only[extra1-True]'

