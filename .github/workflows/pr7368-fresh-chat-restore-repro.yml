name: PR 7368 fresh-chat restore repro

on:
  push:
    branches:
      - "fix/pr-7368-fresh-chat-repro-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-chat-repro:
    name: Fresh-chat null-key loss reproduced
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Reproduce fresh-chat first-save key transition
        run: |
          python -m pytest -q \
            tests/studio/test_pr7368_fresh_chat_restore_repro.py
          {
            echo "### Fresh-chat restore issue reproduced"
            echo
            echo "The first send is armed with a null draft key. After the"
            echo "thread receives its saved ID, the mismatch branch drops"
            echo "the restore because there is no old key to persist."
          } >> "$GITHUB_STEP_SUMMARY"
