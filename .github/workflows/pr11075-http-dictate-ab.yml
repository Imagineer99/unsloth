# Disposable live Studio repro workflow. Delete after validation.

name: "PR 11075 HTTP Dictate A-B"

on:
  push:
    branches:
      - "fix/pr11075-http-dictate-ab-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-studio:
    name: "Pinned Studio Dictate A/B"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        browser: ["chromium"]
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-${{ matrix.browser }}
      STUDIO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'

      - name: Install Playwright dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps "${{ matrix.browser }}"
          else
            python -m playwright install "${{ matrix.browser }}"
          fi

      - name: Install locked CPU test environment
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          python -m pip install -r .github/scripts/pr11075/requirements.txt
          python -m pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Launch Studio and run Playwright probe
        shell: bash
        run: |
          python ".github/scripts/pr11075-http-dictate-ab-probe.py"

      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr11075-dictate-ab-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
