name: "staging-11365 windows-latest"
on:
  push:
    branches: ["pr-11365-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - name: the test this PR changes, run directly
        run: pwsh -NoProfile -File tests/studio/test_uv_safe_requirements_path.ps1
      - name: and through its pytest wrapper, which is how CI reaches it
        run: python -m pytest tests/python/test_uv_requirements_path_space.py -q
