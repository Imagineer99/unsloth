name: "win-preexisting pr-10597-xplat-ci"
on:
  push:
    branches: ["pr-10597-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-timeout
      - name: files that exist on BOTH arms
        run: PYTHONPATH=studio/backend python -m pytest tests/studio/install/test_install_llama_prebuilt_logic.py tests/test_studio_install_workspace_guard.py -q --tb=no
