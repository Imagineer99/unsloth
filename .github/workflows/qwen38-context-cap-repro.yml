name: Qwen3.8 27B 16GiB context repro

on:
  push:
    branches:
      - fix/qwen38-context-cap-repro-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-release-behavior:
    name: Reproduce v0.1.800-beta planner behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pinned release repro
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.11

      - name: Install focused test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1
          huggingface-hub==1.28.0

      - name: Reproduce the 4096 fallback and unchanged Q4 cap
        run: >-
          python -m pytest -q -s
          studio/backend/tests/test_llama_cpp_placement.py::test_qwen38_27b_16gb_auto_context_reproduces_4096_after_slot_reduction
