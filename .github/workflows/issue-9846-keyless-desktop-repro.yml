# Disposable repro workflow. Delete after validation.

name: "Issue 9846 Desktop Keyless Repro"

on:
  push:
    branches:
      - "fix/issue-9846-keyless-repro-ci*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install focused authentication dependencies"
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            fastapi==0.141.1 pyjwt==2.13.0 uvicorn==0.52.1 \
            'cryptography>=42.0.0' 'structlog>=24.1.0'

      - name: "Reproduce Desktop keyless password gate"
        shell: bash
        run: |
          python .github/scripts/issue-9846-keyless-desktop-repro.py
