# Disposable repro workflow. Delete after validation.

name: "PR 7333 persisted plugin repro (macOS)"

on:
  push:
    branches:
      - "fix/pr-7333-persisted-plugin-repro-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install PR package"
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --editable .
          python -m pip install --disable-pip-version-check "click==8.3.1"

      - name: "Install Claude Code 2.1.217"
        shell: bash
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.217
          claude --version

      - name: "Fresh plugin control"
        shell: bash
        run: |
          python .github/repro/pr7333_persisted_plugin_repro.py fresh

      - name: "Persisted plugin upgrade reproduction (expected failure)"
        shell: bash
        run: |
          python .github/repro/pr7333_persisted_plugin_repro.py upgrade
