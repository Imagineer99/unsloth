# Reachability-reviewed advisories whose patched major/minor cannot currently
# be selected through the upstream Tauri dependency graph.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-10-16
reason = "The affected glib::VariantStrIter iterator APIs are unused by Unsloth and its resolved transitive crates; Tauri's GTK3 stack currently constrains glib below 0.20."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0097"
ignoreUntil = 2026-10-16
reason = "rand 0.7.3 is build-only through phf_codegen and uses a deterministically seeded SmallRng; the advisory requires ThreadRng plus a custom logger, and rand 0.7.3 has no log feature."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0194"
ignoreUntil = 2026-10-16
reason = "The quick-xml consumers do not parse attacker-controlled attributes: WinRT notification uses only escape(), plist never iterates attributes, and wayland-scanner parses trusted build-time protocol XML."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0195"
ignoreUntil = 2026-10-16
reason = "No resolved quick-xml consumer uses the affected NsReader or NamespaceResolver APIs; they use plain Reader or escape() only."
